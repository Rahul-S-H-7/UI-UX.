<html>
    <head>
        <h1> MY FEEDBACK FORM</h1>
    </head>
    <BODY>
        <FORM>
            <label>Name :</label>
            <input type="text"><br><br>
            <label>Email :</label>
            <input type="Email"><br><br>
            <label>Password :</label>
            <input type="Password"><br><br>
            <b>Please check all the emotions that apply to you:</b>
            <input type="checkbox" name="Angry" value="Angry"> Angry<br>
            <input type="checkbox" name="Sad" value="Sad">Sad<br>
            <input type="checkbox" name="Happy" value="Happy">Happy<br>
            <input type="checkbox" name="Ambivalent" value="Ambivalent">Ambivalent<br>
            <B>How satisfied are you with our service></B><br><br>
            <input type="radio" value="Very Satisfied">Very Satisfied<br>
            <input type="radio" value="Satisfied">Satisfied<br>
            <input type="radio" value="Didn't Care">Didn't Care<br>
            <input type="radio" value="Dissatisfied">Dissatisfied<br>
            <input type="radio" value="Very Dissatisfied">Very Dissatisfied<br>
            <b>Further Comments</b>
            <textarea Name="name " rows=4 cols=50wrap>
            </textarea><br><br>
            <b>Bio Photo</b>
            <input type="file" accept=".png,.jpeg"><br>
            <b>Location Visited:</b>
            <select name="Location">
             <option value="location">Mumbai</option>
             <option value="location">Mangalore</option>
              <option value="location">Bangalore</option>
               <option value="location">Mysore</option>
            </select><br><br>

            <input type="Submit" value="Submit">
            <input type="Reset">
        </FORM>
    </BODY>
</html>
